[project]
name = "del"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "jupyter-ai[all]>=2.31.7",
    "matplotlib>=3.10.8",
    "notebook>=7.5.5",
    "notebook-intelligence>=4.4.0",
    "numpy>=2.4.3",
    "pandas>=3.0.1",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "skorch>=1.3.1",
    "torch",
    "torchvision",
    "tqdm>=4.67.3",
    "wandb==0.25.0",
]

[tool.uv]
override-dependencies = [
    "wandb==0.25.0",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
